# .github/workflows/versioning.yml
name: Versioning

on:
  workflow_call:
    inputs:
      suffix:
        type: string
        default: ""
    outputs:
      new_tag:
        description: "New version tag"
        value: ${{ jobs.version.outputs.new_tag }}
      bumped:
        description: "Whether version was bumped"
        value: ${{ jobs.version.outputs.bumped }}
    secrets:
      token:
        required: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump.outputs.NEW_TAG }}
      bumped: ${{ steps.bump.outputs.BUMPED }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.token }}

      - name: Bump version and push tag
        id: bump
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          SUFFIX="${{ inputs.suffix }}"
          LATEST_TAG=$(git tag --list "v*${SUFFIX}" --sort=-version:refname | head -n1 || echo "v0.0.0${SUFFIX}")

          BASE_TAG=${LATEST_TAG%$SUFFIX}
          MAJOR=$(echo $BASE_TAG | cut -d. -f1 | tr -d v)
          MINOR=$(echo $BASE_TAG | cut -d. -f2)
          PATCH=$(echo $BASE_TAG | cut -d. -f3)

          if echo "$COMMIT_MSG" | grep -qE "^feat!|BREAKING CHANGE"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMIT_MSG" | grep -qE "^feat"; then
            MINOR=$((MINOR + 1)); PATCH=0
          elif echo "$COMMIT_MSG" | grep -qE "^(fix|perf|refactor)"; then
            PATCH=$((PATCH + 1))
          else
            echo "No version bump needed, skipping"
            echo "BUMPED=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_TAG="v$MAJOR.$MINOR.$PATCH${SUFFIX}"
          echo "Bumping $LATEST_TAG → $NEW_TAG"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG

          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "BUMPED=true" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
