# .github/workflows/release.yaml
name: Release

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Quality Checks
    uses: ./.github/workflows/test.yaml

  version:
    name: Release Management
    needs: test
    uses: ./.github/workflows/versioning.yaml
    with:
      suffix: ${{ github.ref_name == 'dev' && '-dev' || '' }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & Publish
    needs: version
    if: needs.version.outputs.bumped == 'true'
    uses: ./.github/workflows/build.yaml
    with:
      tag: ${{ needs.version.outputs.new_tag }}
      alias: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
