services:
  app:
    build:
      dockerfile: Dockerfile.local
      context: .
    image: ghcr.io/dani-susanto/go-account-service:local.latest
    container_name: go-account-service-local-app
    env_file:
      - .env.local
    environment:
      APP_ENV: local
    ports:
      - 8001:8001
    command: ["go", "run", "cmd/http/main.go"]
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8001"]

  worker:
    build:
      dockerfile: Dockerfile.local
      context: .
    image: ghcr.io/dani-susanto/go-account-service:local.latest
    container_name: go-account-service-local-worker
    env_file:
      - .env.local
    environment:
      APP_ENV: local
    command: ["go", "run", "cmd/worker/main.go"]
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:18-alpine
    container_name: go-account-service-local-db
    env_file:
      - .env.local
    environment:
      APP_ENV: local
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - local-db-volume:/var/lib/postgresql
      - ./docker/postgres/master/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/master/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./docker/postgres/master/setup-replica.sh:/docker-entrypoint-initdb.d/setup-replica.sh
    ports:
      - 5432:5432
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # db-slave:
  #   image: postgres:18-alpine
  #   container_name: go-account-service-local-db-slave
  #   env_file:
  #     - .env.local
  #   environment:
  #     APP_ENV: local
  #     POSTGRES_DB: ${DB_DATABASE}
  #     POSTGRES_USER: ${DB_USERNAME}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
