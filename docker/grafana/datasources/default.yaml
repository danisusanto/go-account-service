apiVersion: 1
datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://go-account-service-local-loki:3100
    isDefault: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://go-account-service-local-tempo:3200
    isDefault: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: Loki
        filterByTraceID: true
        filterBySpanID: true
        tags:
          - key: service.name
            value: service_name

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://go-account-service-local-prometheus:9090
    isDefault: true
