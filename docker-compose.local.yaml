services:
  app:
    build:
      dockerfile: Dockerfile.local
      context: .
    image: ghcr.io/dani-susanto/go-account-service
    pull_policy: never
    container_name: go-account-service-local-app
    env_file:
      - .env.local
    ports:
      - 8001:8001
    command: ["go", "run", "cmd/http/main.go"]
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8001"]
    networks:
      - infrastructure-local-network

  worker:
    build:
      dockerfile: Dockerfile.local
      context: .
    image: ghcr.io/dani-susanto/go-account-service
    pull_policy: never
    container_name: go-account-service-local-worker
    env_file:
      - .env.local
    command: ["go", "run", "cmd/worker/main.go"]
    volumes:
      - ./:/app
    networks:
      - infrastructure-local-network

networks:
  infrastructure-local-network:
    external: true
