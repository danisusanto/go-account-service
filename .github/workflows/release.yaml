# .github/workflows/release.yml
name: Release

on:
  push:
    branches:
      - main
      - dev

jobs:
  version:
    uses: ./.github/workflows/versioning.yml
    with:
      suffix: ${{ github.ref_name == 'main' && '' || format('-{0}', github.ref_name) }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    if: needs.version.outputs.bumped == 'true'
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.version.outputs.new_tag }}
      alias: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
