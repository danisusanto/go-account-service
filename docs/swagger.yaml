basePath: /api
definitions:
  github_com_dani-susanto_go-account-service_internal_application_usecase.GetUserUsecaseOutput:
    properties:
      country_code:
        type: string
      created_at:
        type: string
      email:
        type: string
      google_id:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      phone_number:
        type: string
      role:
        $ref: '#/definitions/github_com_dani-susanto_go-account-service_internal_domain_entity.Role'
      updated_at:
        type: string
    type: object
  github_com_dani-susanto_go-account-service_internal_application_usecase.LoginUsecaseOutput:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  github_com_dani-susanto_go-account-service_internal_application_usecase.RefreshTokenOutput:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  github_com_dani-susanto_go-account-service_internal_application_usecase.RegisterUsecaseOutput:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  github_com_dani-susanto_go-account-service_internal_application_usecase.UpdateUserUsecaseOutput:
    properties:
      country_code:
        type: string
      created_at:
        type: string
      email:
        type: string
      google_id:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      phone_number:
        type: string
      role:
        $ref: '#/definitions/github_com_dani-susanto_go-account-service_internal_domain_entity.Role'
      updated_at:
        type: string
    type: object
  github_com_dani-susanto_go-account-service_internal_domain_entity.Role:
    enum:
    - ADMIN
    - MANAGER
    - STAFF
    - VIEWER
    type: string
    x-enum-varnames:
    - ADMIN
    - MANAGER
    - STAFF
    - VIEWER
  internal_handler_rest.changeEmailRequest:
    properties:
      email:
        type: string
    type: object
  internal_handler_rest.changeEmailVerifyRequest:
    properties:
      token:
        type: string
    type: object
  internal_handler_rest.changePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
      new_password_confirm:
        type: string
    type: object
  internal_handler_rest.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  internal_handler_rest.refreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  internal_handler_rest.registerRequest:
    properties:
      country_code:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone_number:
        type: string
    type: object
  internal_handler_rest.resetPasswordDemandRequest:
    properties:
      email:
        type: string
    type: object
  internal_handler_rest.resetPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        type: string
      new_password_confirm:
        type: string
      token:
        type: string
    type: object
  internal_handler_rest.resetPasswordVerifyRequest:
    properties:
      email:
        type: string
      token:
        type: string
    type: object
  internal_handler_rest.updateMeRequest:
    properties:
      country_code:
        type: string
      name:
        type: string
      phone_number:
        type: string
    type: object
  rest.ErrorResponse:
    properties:
      errors:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      message:
        type: string
      status:
        example: false
        type: boolean
    type: object
  rest.MetaData:
    properties:
      current_page:
        type: integer
      from:
        type: integer
      last_page:
        type: integer
      next_link:
        type: string
      next_page:
        type: integer
      per_page:
        type: integer
      prev_link:
        type: string
      prev_page:
        type: integer
      to:
        type: integer
      total:
        type: integer
    type: object
  rest.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/rest.MetaData'
      status:
        example: true
        type: boolean
    type: object
info:
  contact:
    email: support@your-domain.com
    name: API Support
    url: https://your-domain.com/support
  description: |-
    Account Service API provides authentication, authorization, account management, and identity-related operations for applications and external integrations.

    Features include:
    - User authentication and session management
    - Access token and refresh token lifecycle
    - User registration and account provisioning
    - Password management and credential verification
    - Account profile management
    - Role and permission assignment
    - Secure API access using Bearer Authentication
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://your-domain.com/terms
  title: Account Service API
  version: 1.0.0
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Check the availability and operational status of the service.
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/rest.SuccessResponse'
      summary: Service health check
      tags:
      - System
  /v1/change-email/request:
    post:
      consumes:
      - application/json
      description: Initiate an email change process by sending a verification code
        to the specified email address. The verification code must be used to complete
        the email change operation.
      parameters:
      - description: Email change request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.changeEmailRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request payload or validation failure
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Request email change verification
      tags:
      - Account
  /v1/change-email/verify:
    post:
      consumes:
      - application/json
      description: Verify the email change request using the provided verification
        code and update the authenticated user's email address.
      parameters:
      - description: Email change verification
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.changeEmailVerifyRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request payload or validation failure
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Verify email change
      tags:
      - Account
  /v1/change-password:
    post:
      consumes:
      - application/json
      description: Update the authenticated user's password by providing the current
        password and a new password.
      parameters:
      - description: Password change request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.changePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request payload, validation failure, or incorrect current
            password
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Change password
      tags:
      - Account
  /v1/email-verification/request:
    post:
      consumes:
      - application/json
      description: Send a new email verification link to the authenticated user's
        email address.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Request email verification
      tags:
      - Account
  /v1/email-verification/verify:
    get:
      consumes:
      - application/json
      description: Verify a user's email address using the verification token provided
        in the email verification link.
      parameters:
      - description: Email address
        in: query
        name: source
        required: true
        type: string
      - description: Email verification token
        in: query
        name: verify
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            $ref: '#/definitions/rest.SuccessResponse'
        "400":
          description: Invalid request parameters or validation failure
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      summary: Verify email address
      tags:
      - Authentication
  /v1/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user using email and password credentials. Returns
        an access token and refresh token for subsequent authenticated requests.
      parameters:
      - description: User login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_dani-susanto_go-account-service_internal_application_usecase.LoginUsecaseOutput'
              type: object
        "400":
          description: Invalid request payload or validation failure
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "403":
          description: Account is inactive or suspended
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "404":
          description: User account not found
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      summary: User authentication
      tags:
      - Authentication
  /v1/me:
    get:
      consumes:
      - application/json
      description: Retrieve profile information for the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: User profile retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/rest.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_dani-susanto_go-account-service_internal_application_usecase.GetUserUsecaseOutput'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get authenticated user
      tags:
      - Authentication
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's profile information, including
        name and phone number.
      parameters:
      - description: Profile update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.updateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/rest.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_dani-susanto_go-account-service_internal_application_usecase.UpdateUserUsecaseOutput'
              type: object
        "400":
          description: Invalid request payload or validation failure
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update profile
      tags:
      - Account
  /v1/refresh-token:
    post:
      consumes:
      - application/json
      description: Generate a new access token and refresh token using a valid refresh
        token. The previous refresh token will be invalidated after successful use.
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.refreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed successfully
          schema:
            allOf:
            - $ref: '#/definitions/rest.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_dani-susanto_go-account-service_internal_application_usecase.RefreshTokenOutput'
              type: object
        "400":
          description: Invalid request payload, invalid refresh token, expired refresh
            token, or refresh token session expired
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      summary: Refresh access token
      tags:
      - Authentication
  /v1/register:
    post:
      consumes:
      - application/json
      description: Create a new user account and issue access and refresh tokens for
        authenticated API access.
      parameters:
      - description: User registration information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.registerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Registration successful
          schema:
            allOf:
            - $ref: '#/definitions/rest.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_dani-susanto_go-account-service_internal_application_usecase.RegisterUsecaseOutput'
              type: object
        "400":
          description: Invalid request payload or validation failure
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "409":
          description: Email address already exists
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      summary: User registration
      tags:
      - Authentication
  /v1/reset-password:
    post:
      consumes:
      - application/json
      description: Reset the authenticated user's password using a valid password
        reset verification token.
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request payload, validation failure, or invalid password
            reset token
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      summary: Reset password
      tags:
      - Authentication
  /v1/reset-password/request:
    post:
      consumes:
      - application/json
      description: Initiate a password reset process by sending a password reset verification
        code to the user's registered email address.
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.resetPasswordDemandRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request payload or validation failure
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      summary: Request password reset
      tags:
      - Authentication
  /v1/reset-password/verify:
    post:
      consumes:
      - application/json
      description: Verify a password reset token before proceeding with the password
        reset process.
      parameters:
      - description: Password reset verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.resetPasswordVerifyRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request payload, validation failure, or invalid verification
            token
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/rest.ErrorResponse'
      summary: Verify password reset request
      tags:
      - Authentication
securityDefinitions:
  ApiKeyAuth:
    description: 'Bearer access token. Format: "Bearer <access_token>"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
