global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['go-account-service-local-node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['go-account-service-local-cadvisor:8080']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['go-account-service-local-otel-collector:8889']
